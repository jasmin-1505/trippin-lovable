<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trippin&#8217; &mdash; You&#8217;re offline</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #FDF0E0;
        font-family: Arial, Helvetica, sans-serif;
      }
      .wrap {
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 32px;
        box-sizing: border-box;
      }
      .logo {
        width: 64px;
        height: 64px;
        margin-bottom: 20px;
      }
      .wordmark {
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 22px;
        color: #C17D3C;
        margin-bottom: 28px;
      }
      h1 {
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 24px;
        color: #6B3A2A;
        margin: 0 0 8px;
      }
      p {
        font-size: 14px;
        color: #6B3A2A;
        opacity: 0.8;
        margin: 0 0 24px;
        max-width: 280px;
      }
      button {
        background: #C17D3C;
        color: #FDF0E0;
        border: none;
        border-radius: 999px;
        padding: 14px 32px;
        font-size: 15px;
        font-family: Arial, Helvetica, sans-serif;
        font-weight: bold;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <svg class="logo" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M6 46 C14 26, 20 54, 30 34 C38 18, 44 34, 52 20"
              stroke="#C17D3C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="54" cy="17" r="4.5" fill="#C17D3C"/>
      </svg>
      <div class="wordmark">trippin&#8217;</div>
      <h1>You&#8217;re offline</h1>
      <p>Save a trail first to access it here.</p>
      <button onclick="window.location.reload()">Retry</button>
    </div>
  </body>
</html>
